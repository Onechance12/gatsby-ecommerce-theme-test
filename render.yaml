services:
  - type: web
    name: jobnimbus-chatgpt-bridge
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm run bridge
    healthCheckPath: /health
    envVars:
      - key: JOBNIMBUS_API_BASE_URL
        value: https://app.jobnimbus.com/api1
      - key: JOBNIMBUS_API_KEY
        sync: false
      - key: JOBNIMBUS_BRIDGE_TOKEN
        sync: false
      - key: BRIDGE_ALLOW_WRITES
        value: "false"
      - key: ALLOW_JOBNIMBUS_WRITES
        value: "false"
      - key: JOBNIMBUS_USE_FIXTURES
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_VOICE
        value: marin
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_VERIFIED_TEST_NUMBER
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: TWILIO_MEDIA_STREAM_URL
        sync: false
      - key: VOICE_PUBLIC_BASE_URL
        sync: false
      - key: VOICE_STREAM_TOKEN
        sync: false
      - key: ALLOW_VOICE_CALLS
        value: "false"
