services:
  - type: web
    name: jobnimbus-chatgpt-bridge
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JOBNIMBUS_API_BASE_URL
        value: https://app.jobnimbus.com/api1
      - key: JOBNIMBUS_API_KEY
        sync: false
      - key: JOBNIMBUS_BRIDGE_TOKEN
        sync: false
      - key: BRIDGE_ALLOW_WRITES
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER
        value: me
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_VOICE
        value: marin
      - key: VOICE_PUBLIC_BASE_URL
        value: https://jobnimbus-chatgpt-bridge.onrender.com
      - key: VOICE_STREAM_TOKEN
        sync: false
