services:
  - type: web
    name: hcn-operations-platform
    runtime: docker
    plan: starter
    branch: codex/hcn-platform-foundation
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    disk:
      name: hcn-operations-data
      mountPath: /var/data/hcn-operations
      sizeGB: 1
    envVars:
      # JobNimbus remains the client system of record.
      - key: JOBNIMBUS_API_BASE_URL
        value: https://app.jobnimbus.com/api1
      - key: JOBNIMBUS_FILE_BASE_URL
        value: https://app.jobnimbus.com/files
      - key: JOBNIMBUS_API_KEY
        sync: false

      # The core action plane is live only behind exact-plan approval,
      # unchanged digests, short-lived single-use challenges, fresh file
      # revalidation, and durable receipts. Call paths remain disabled.
      - key: BRIDGE_ALLOW_WRITES
        value: "true"
      - key: HCN_ACTION_EXECUTION_ENABLED
        value: "true"
      - key: ALLOW_GMAIL_SEND
        value: "true"
      - key: ALLOW_QUO_SEND
        value: "true"
      - key: ALLOW_VOICE_CALLS
        value: "false"
      - key: ALLOW_RETELL_CALLS
        value: "false"
      - key: ALLOW_CLIENT_COORDINATOR_CALLS
        value: "false"
      - key: ALLOW_CARRIER_FOLLOWUP_CALLS
        value: "false"

      # Isolated HCN-only identity, storage, and Thresher operational state.
      - key: HCN_SERVICE_NAME
        value: hcn-operations-platform
      - key: HCN_OPERATIONS_ROOT
        value: /var/data/hcn-operations
      - key: HCN_THRESHER_ENABLED
        value: "true"
      - key: HCN_THRESHER_STORE_PATH
        value: /var/data/hcn-operations/thresher/state.enc.json
      - key: HCN_THRESHER_STORE_KEY
        sync: false
      - key: HCN_THRESHER_REFERENCE_KEY
        sync: false
      - key: HCN_THRESHER_SIGNING_KEY
        sync: false
      - key: HCN_TENANT_ID
        sync: false
      - key: HCN_REFERENCE_KEY
        sync: false
      # Dedicated Thresher AI reasoning runtime on Groq GPT-OSS 20B. The model
      # may read the signed-in employee's allowlisted evidence and recommend
      # next steps, but it cannot prepare or execute an action plan. Create a
      # separate funded Groq project/key for HCN; never reuse Rolo.ai or another
      # product key.
      - key: HCN_THRESHER_AI_ENABLED
        value: "true"
      - key: HCN_THRESHER_AI_GROQ_API_KEY
        sync: false
      # Durable employee chat transcripts use their own HCN-only encrypted
      # store and key. Never reuse a Thresher state or provider credential.
      - key: HCN_ASSISTANT_HISTORY_KEY
        sync: false
      - key: HCN_ASSISTANT_HISTORY_STORE_PATH
        value: /var/data/hcn-operations/platform/assistant-conversations.enc.json
      # Dedicated least-privilege credential used only by the HP HCN operator.
      # Never reuse the shared bridge token or a Chance Brain credential.
      - key: CODEX_OPERATOR_TOKEN
        sync: false

      # Legacy Custom GPT/HP Gmail and Calendar fallback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Dedicated HCN browser sign-in and employee Gmail/Calendar grant.
      - key: HCN_GOOGLE_CLIENT_ID
        sync: false
      - key: HCN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: HCN_GOOGLE_GRANT_KEY
        sync: false
      - key: HCN_GOOGLE_GRANT_STORE_PATH
        value: /var/data/hcn-operations/platform/google-grants.enc.json
      - key: ALLOW_GOOGLE_USER_AUTH
        value: "true"
      - key: GOOGLE_OAUTH_ALLOWED_DOMAIN
        value: wavepa.com
      - key: HCN_ALLOW_ACTIVE_JOBNIMBUS_GOOGLE_USERS
        value: "false"
      - key: AUTO_ENROLL_WAVE_USERS
        value: "false"
      - key: CHANCE_GOOGLE_EMAIL
        value: cpearson@wavepa.com
      - key: CHANCE_GOOGLE_SUBJECT
        sync: false
      - key: WAVE_AUTH_USERS_JSON
        sync: false
      - key: OAUTH_SESSION_SECRET
        sync: false
      # Custom GPTs use the HCN service's OAuth facade. Keep this client
      # credential distinct from Google login, employee connectors, and the
      # local HP operator credential.
      - key: GPT_OAUTH_CLIENT_ID
        value: hcn-operations-gpt
      - key: GPT_OAUTH_CLIENT_SECRET
        sync: false
      - key: HCN_CONSOLE_ENABLED
        value: "true"
      - key: HCN_CONSOLE_ORIGIN
        value: https://hcn-operations-platform.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://hcn-operations-platform.onrender.com
      - key: GMAIL_USER
        value: me
      - key: GOOGLE_CALENDAR_ID
        value: primary
      # Dedicated server-side fallback for the HP operator. Interactive
      # employees continue to use their own encrypted Google grants.
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

      # Each employee proves control of a company Quo line by OTP.
      - key: QUO_API_KEY
        sync: false
      - key: QUO_API_BASE_URL
        value: https://api.quo.com/v1
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: QUO_VERIFICATION_FROM_NUMBER
        sync: false
      - key: HCN_QUO_LINK_KEY
        sync: false
      - key: HCN_QUO_LINE_STORE_PATH
        value: /var/data/hcn-operations/platform/quo-line-store.enc.json
      - key: QUO_DEFAULT_FROM_NUMBER
        sync: false

      # Company management sweep and assigned-file employee action plane.
      - key: CHANCE_JOBNIMBUS_OWNER_ID
        value: fc95a213f70e4c9daddc5fa366be9941
      - key: HCN_MANAGEMENT_ADJUSTERS_JSON
        sync: false
      - key: HCN_MANAGEMENT_MAX_FILES
        value: "300"
      - key: HCN_MANAGEMENT_ACTIVITY_MAX_RECORDS
        value: "1000"
      - key: HCN_MANAGEMENT_READ_CONCURRENCY
        value: "4"
      - key: HCN_MANAGEMENT_PROVIDER_REQUEST_BUDGET
        value: "750"
      - key: ACTION_BATCH_STORE_PATH
        value: /var/data/hcn-operations/platform/action-batches.json
      - key: ACTION_APPROVAL_STORE_PATH
        value: /var/data/hcn-operations/platform/action-approvals.json
      - key: HCN_ACTION_RECEIPT_STORE_PATH
        value: /var/data/hcn-operations/platform/action-receipts.json
      - key: OUTBOUND_SEND_STORE_PATH
        value: /var/data/hcn-operations/platform/outbound-sends.json
      - key: CLAIM_CALL_STORE_PATH
        value: /var/data/hcn-operations/platform/claim-call-ledger.json
      - key: HCN_IDENTITY_PIN_STORE_PATH
        value: /var/data/hcn-operations/platform/identity-pins.json
      - key: HCN_INVITATION_STORE_PATH
        value: /var/data/hcn-operations/platform/employee-invitations.enc.json
      - key: ACTION_APPROVAL_TTL_SECONDS
        value: "900"
      - key: MAX_ARTIFACT_BYTES
        value: "5242880"
      - key: MAX_CHATGPT_FILE_BYTES
        value: "8388608"
      - key: ARTIFACT_TTL_HOURS
        value: "72"
