services:
  - type: web
    name: jobnimbus-chatgpt-bridge
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: jobnimbus-bridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JOBNIMBUS_API_BASE_URL
        value: https://app.jobnimbus.com/api1
      - key: JOBNIMBUS_FILE_BASE_URL
        value: https://app.jobnimbus.com/files
      - key: JOBNIMBUS_API_KEY
        sync: false
      - key: JOBNIMBUS_BRIDGE_TOKEN
        sync: false
      - key: BRIDGE_ALLOW_WRITES
        value: "false"
      - key: MEMORY_ROOT
        value: /var/data
      - key: MAX_ARTIFACT_BYTES
        value: "5242880"
      - key: MAX_CHATGPT_FILE_BYTES
        value: "8388608"
      - key: ARTIFACT_TTL_HOURS
        value: "72"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: ALLOW_GOOGLE_USER_AUTH
        value: "true"
      - key: GOOGLE_OAUTH_ALLOWED_DOMAIN
        value: wavepa.com
      - key: CHANCE_GOOGLE_EMAIL
        value: cpearson@wavepa.com
      - key: WAVE_AUTH_USERS_JSON
        sync: false
      - key: GPT_OAUTH_CLIENT_ID
        value: wave-jobnimbus-gpt
      - key: GPT_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_SESSION_SECRET
        sync: false
      - key: GMAIL_USER
        value: me
      - key: ALLOW_GMAIL_SEND
        value: "false"
      - key: QUO_API_KEY
        sync: false
      - key: QUO_API_BASE_URL
        value: https://api.quo.com/v1
      - key: QUO_DEFAULT_FROM_NUMBER
        sync: false
      - key: ALLOW_QUO_SEND
        value: "false"
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: SCHEDULING_HORIZON_DAYS
        value: "21"
      - key: SCHEDULING_APPOINTMENT_MINUTES
        value: "120"
      - key: SCHEDULING_TRAVEL_BUFFER_MINUTES
        value: "60"
      - key: SCHEDULING_MIN_LEAD_HOURS
        value: "24"
      - key: SCHEDULING_WORKDAY_START
        value: "08:00"
      - key: SCHEDULING_WORKDAY_END
        value: "17:00"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_VOICE
        value: marin
      - key: VOICE_PUBLIC_BASE_URL
        value: https://jobnimbus-chatgpt-bridge.onrender.com
      - key: VOICE_STREAM_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: QUO_VERIFICATION_FROM_NUMBER
        sync: false
      - key: TWILIO_VERIFIED_TEST_NUMBER
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: ALLOW_VOICE_CALLS
        value: "false"
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_HOMEOWNER_AGENT_ID
        sync: false
      - key: RETELL_CLIENT_COORDINATOR_AGENT_ID
        sync: false
      - key: RETELL_CARRIER_FOLLOWUP_AGENT_ID
        sync: false
      - key: RETELL_FROM_NUMBER
        sync: false
      - key: ALLOW_RETELL_CALLS
        value: "true"
      - key: ALLOW_CLIENT_COORDINATOR_CALLS
        value: "false"
      - key: ALLOW_CARRIER_FOLLOWUP_CALLS
        value: "true"
      - key: RETELL_CALLBACK_TTL_HOURS
        value: "72"
      - key: CHANCE_JOBNIMBUS_OWNER_ID
        value: fc95a213f70e4c9daddc5fa366be9941
      - key: CLAIM_CALL_STORE_PATH
        value: /var/data/bridge/claim-call-ledger.json
      - key: ACTION_BATCH_STORE_PATH
        value: /var/data/bridge/action-batches.json
      - key: OUTBOUND_SEND_STORE_PATH
        value: /var/data/bridge/outbound-sends.json
      - key: QUO_LINE_LINK_STORE_PATH
        value: /var/data/bridge/quo-line-links.json
      - key: QUO_LINE_CHALLENGE_STORE_PATH
        value: /var/data/bridge/quo-line-challenges.json
